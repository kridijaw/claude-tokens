<style>

  }

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 24px; display: grid; gap: 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, input, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 10px; }

.toggle { display: flex; margin-left: auto; }

<main>

<script>
"use strict";
const DATA = /*DATA*/null;
const N = DATA.types.length, TOK = 4, COST = 4 + N, FOOT = COST + N;
const $ = id => document.getElementById(id);
const color = i => `var(--c${i})`;
const first = DATA.rows[0][0], last = DATA.rows[DATA.rows.length - 1][0];
const state = { from: first, to: last, group: "", repo: "", model: "", unit: "cost", day: null };

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "style") node.style.cssText = v;
    else if (k.startsWith("on")) node[k] = v;
    else if (k === "class") node.className = v;
    else node.setAttribute(k, v);

  for (const kid of kids) node.append(kid);
  return node;
}
function svg(tag, props = {}, text) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(props)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}
const shift = (day, n) => new Date(Date.parse(day) + n * 864e5).toISOString().slice(0, 10);
const weekday = day => (new Date(day).getUTCDay() + 6) % 7;
const days = (from, to) => { const out = []; for (let d = from; d <= to; d = shift(d, 1)) out.push(d); return out; };
const nice = day => new Date(day).toLocaleDateString("en", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short", year: "numeric" });
const short = day => new Date(day).toLocaleDateString("en", { timeZone: "UTC", day: "numeric", month: "short" });
const inGap = day => DATA.gaps.some(([a, b]) => day >= a && day <= b);
const usd = v => "$" + v.toLocaleString("en", v >= 1000 ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const compact = v => v.toLocaleString("en", { notation: "compact", maximumFractionDigits: 1 });
const metric = (key = state.unit) => METRICS.find(m => m.key === key);
const unitLabel = () => state.unit === "cost" ? "API cost" : state.unit === "tokens" ? "Tokens" : metric().label;
const mobile = matchMedia("(max-width: 860px)");
const unitsOf = m => mobile.matches && m.mobile || m.units;
const fmt = (v, key = state.unit) => key === "cost" ? usd(v) : key === "tokens" ? compact(v) : quantity(v, unitsOf(metric(key)));
const axis = (v, [name, size]) => state.unit === "cost" ? "$" + (v >= 1e4 ? compact(v) : v.toLocaleString("en"))
  : state.unit === "tokens" ? compact(v) : (v / size).toLocaleString("en", { maximumSignificantDigits: 3 }) + " " + name;
const pct = v => v >= 0.0995 ? (v * 100).toFixed(0) + "%" : v >= 0.0005 ? (v * 100).toFixed(1) + "%" : v > 0 ? "<0.1%" : "0%";
const base = () => state.unit === "cost" ? COST : state.unit === "tokens" ? TOK : FOOT;
const span = (row, at) => { let s = 0; for (let i = 0; i < N; i++) s += row[at + i]; return s; };

const F = DATA.footprint;
const co2 = kwh => kwh * F.co2_kg_per_kwh;
const METRICS = [
  { key: "energy", label: "Energy", of: kwh => kwh, units: [["Wh", 0.001], ["kWh", 1], ["MWh", 1000]],
    how: [`API cost × ${F.wh_per_usd[1]} Wh per USD`, `Third-party estimates of inference electricity, including data center overhead. The range uses ${F.wh_per_usd[0]} and ${F.wh_per_usd[2]} Wh per USD.`] },
  { key: "co2", label: "CO2", of: co2, units: [["g", 0.001], ["kg", 1], ["t", 1000]],
    how: [`Energy × ${F.co2_kg_per_kwh} kg per kWh`, "CO2 and other greenhouse gases emitted per kWh on the US average grid."] },
  { key: "water", label: "Water", of: kwh => kwh * F.water_l_per_kwh, units: [["mL", 0.001], ["L", 1], ["m³", 1000]],
    how: [`Energy × ${F.water_l_per_kwh} L per kWh`, "On-site cooling plus the water consumed generating the electricity."] },
  { key: "trees", label: "Tree-years", of: kwh => co2(kwh) / F.co2_kg_per_tree_year, units: [["tree-years", 1]], mobile: [["ty", 1]],
    how: [`CO2 ÷ ${F.co2_kg_per_tree_year} kg per tree-year`, "CO2 a mature tree absorbs in a year."] },
  { key: "gha", label: "Global hectares", of: kwh => co2(kwh) / 1000 * F.gha_per_t_co2, units: [["gm²", 0.0001], ["gha", 1]],
    how: [`CO2 × ${F.gha_per_t_co2} gha per t`, "Biologically productive land of world-average yield needed for a year to absorb the CO2."] },
  { key: "seaice", label: "Arctic sea ice", of: kwh => co2(kwh) / 1000 * F.sea_ice_m2_per_t_co2, units: [["cm²", 0.0001], ["m²", 1]],
    how: [`CO2 × ${F.sea_ice_m2_per_t_co2} m² per t`, "September sea ice lost per t of CO2 emitted."] },
  { key: "km", label: "Km driven", of: kwh => co2(kwh) / F.co2_kg_per_km, units: [["m", 0.001], ["km", 1]],
    how: [`CO2 ÷ ${F.co2_kg_per_km} kg per km`, "Average new car registered in Europe in 2024."] },
  { key: "brain", label: "Human brain time", of: kwh => kwh * 1000 / F.brain_w, units: [["min", 1 / 60], ["h", 1], ["days", 24], ["years", 8766]],
    how: [`Energy ÷ ${F.brain_w} W`, "Power used by a human brain."] },
  { key: "ice", label: "Ice melted", of: kwh => kwh * 3600 / F.ice_kj_per_kg, units: [["g", 0.001], ["kg", 1], ["t", 1000]],
    how: [`Energy × 3600 kJ per kWh ÷ ${F.ice_kj_per_kg} kJ per kg`, "Heat needed to melt ice that is already at 0 °C."] },
];
function footprintOf(usd, scenario = 1) {
  const kwh = usd * F.wh_per_usd[scenario] / 1000;
  return Object.fromEntries(METRICS.map(m => [m.key, m.of(kwh)]));
}
const unitFor = (v, units) => units.findLast(u => v >= u[1]) || units[0];
function quantity(v, units) {
  const [name, size] = unitFor(v, units);
  return (v / size).toLocaleString("en", { minimumSignificantDigits: v ? 3 : 1, maximumSignificantDigits: 3 }) + " " + name;
}

function rowsIn(from, to) {
  return DATA.rows.filter(r => r[0] >= from && r[0] <= to
    && (!state.group || DATA.repos[r[2]][0] === state.group)
    && (!state.repo || DATA.repos[r[2]].join("/") === state.repo)
    && (!state.model || DATA.models[r[3]] === state.model));
}
function sumBy(rows, key) {
  const out = new Map(), m = metric(), rate = m ? footprintOf(1)[m.key] : 0;
  for (const r of rows) {
    const k = key(r);
    let a = out.get(k);
    if (!a) out.set(k, a = new Array(FOOT + N).fill(0));
    for (let i = TOK; i < FOOT; i++) a[i] += r[i];
    if (m) for (let i = 0; i < N; i++) a[FOOT + i] += r[COST + i] * rate;
    if (r[1] === -1) a[0] += m ? span(r, COST) * rate : span(r, base());
  }
  return out;
}
const total = rows => sumBy(rows, () => 0).get(0) || new Array(FOOT + N).fill(0);

function tipRows(title, rows, note) {
  const tip = $("tip");
  tip.replaceChildren(el("div", { class: "t" }, title));
  for (const [value, name, c] of rows) {
    const line = el("div", { class: "r" }, el("b", {}, value));
    if (c) line.append(el("i", { style: `background:${c}` }));
    line.append(el("span", {}, name));
    tip.append(line);
  }
  if (note) tip.append(el("div", { class: "note" }, note));
}
function hover(node, fill, label) {
  const place = (x, y) => {
    const tip = $("tip");
    tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, x + 14 + w > innerWidth ? x - w - 14 : x + 14) + "px";
    tip.style.top = Math.max(8, Math.min(y + 14, innerHeight - h - 8)) + "px";
  };
  node.setAttribute("tabindex", "0");
  node.setAttribute("aria-label", label);
  node.addEventListener("pointermove", e => { fill(); place(e.clientX, e.clientY); });
  node.addEventListener("pointerleave", () => { $("tip").style.display = "none"; });
  node.addEventListener("focus", () => { fill(); const b = node.getBoundingClientRect(); place(b.right, b.top); });
  node.addEventListener("blur", () => { $("tip").style.display = "none"; });
}
function pickable(node, day) {
  const pick = () => { state.day = state.day === day ? null : day; renderDetail(); };
  node.addEventListener("click", pick);
  node.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
}
function dayTip(day, a) {
  if (inGap(day)) return tipRows(nice(day), [["No data", ""]]);
  if (!a) return tipRows(nice(day), [[fmt(0), "Total"]]);
  const b = base();
  const rows = [[fmt(span(a, b)), "Total"]];
  for (let i = 0; i < N; i++) if (a[b + i]) rows.push([fmt(a[b + i]), DATA.types[i], color(i)]);
  tipRows(nice(day), rows, a[0] ? `${fmt(a[0])} is output of whole sessions, booked on this day` : "");
}
const hatch = id => {
  const p = svg("pattern", { id, width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
  p.append(svg("rect", { width: 6, height: 6, fill: "var(--empty)" }), svg("rect", { width: 1.5, height: 6, fill: "var(--axis)" }));
  const d = svg("defs"); d.append(p); return d;
};
function ticks(max) {
  if (!max) return [0];
  const raw = max / 4, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = [];
  for (let i = 0; i * step < max + step; i++) out.push(+(i * step).toPrecision(6));
  return out;
}

function stacked(host, list, byDay, series, height, patternId) {
  const W = host.clientWidth, top = 8, bottom = 22, H = height - top - bottom, m = metric();
  const b = base(), value = a => series.reduce((s, i) => s + a[b + i], 0);
  const max = Math.max(0, ...list.map(d => byDay.has(d) ? value(byDay.get(d)) : 0));
  const shown = m ? unitFor(max, unitsOf(m)) : ["", 1], marks = ticks(max / shown[1]).map(t => t * shown[1]), labels = marks.map(t => axis(t, shown));
  const left = m ? Math.max(52, ...labels.map(t => t.length * 7 + 8)) : 52;
  const slot = (W - left) / list.length, bw = Math.max(1, Math.min(24, slot - Math.min(2, slot * 0.25)));
  const y = v => top + H - (marks.length > 1 ? v / marks[marks.length - 1] * H : 0);
  const root = svg("svg", { height, viewBox: `0 0 ${W} ${height}` });
  root.append(hatch(patternId));
  marks.forEach((t, i) => {
    root.append(svg("line", { x1: left, x2: W, y1: y(t), y2: y(t), stroke: t ? "var(--grid)" : "var(--axis)" }));
    root.append(svg("text", { x: left - 8, y: y(t) + 4, "text-anchor": "end" }, labels[i]));
  });
  let run = null;
  list.concat("").forEach((d, i) => {
    if (d && inGap(d)) { if (run === null) run = i; return; }
    if (run === null) return;
    const x = left + run * slot, w = (i - run) * slot;
    root.append(svg("rect", { x, y: top, width: w, height: H, fill: `url(#${patternId})` }));
    run = null;
  });
  const every = Math.ceil(list.length / Math.max(1, Math.floor((W - left) / 64)));
  list.forEach((d, i) => {
    const x = left + i * slot + (slot - bw) / 2, a = byDay.get(d);
    if (i % every === 0) root.append(svg("text", { x: left + i * slot + slot / 2, y: height - 4, "text-anchor": "middle" }, short(d)));
    if (a && marks.length > 1) {
      const used = series.filter(k => a[b + k] > 0);
      let at = 0;
      used.forEach((k, n) => {
        const y0 = y(at), y1 = y(at += a[b + k]), isTop = n === used.length - 1;
        const gap = !isTop && y0 - y1 > 3 ? (n ? 2 : 2) : 0, h = Math.max(y0 - y1 - gap, 0.5), r = isTop ? Math.min(4, bw / 2, h) : 0;
        root.append(svg("path", { fill: color(k), d: `M${x},${y0} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z` }));
      });
      if (a[0] && series.includes(N - 1)) {
        const cx = x + bw / 2, cy = y(value(a)) - 7;
        root.append(svg("path", { fill: "var(--muted)", d: `M${cx - 4},${cy - 4} h8 l-4,6 z` }));
      }
    }
    const hit = svg("rect", { class: "hit", x: left + i * slot, y: top, width: slot, height: H });
    hover(hit, () => dayTip(d, a), `${nice(d)}: ${inGap(d) ? "no data" : fmt(a ? value(a) : 0)}`);
    pickable(hit, d);
    root.append(hit);
  });
  host.append(root);
}
function legend(host, idx) {
  const box = el("div", { class: "legend" });
  for (const i of idx) box.append(el("span", {}, el("span", { class: "swatch", style: `background:${color(i)}` }), DATA.types[i]));
  host.append(box);
}
const present = a => [...Array(N).keys()].filter(i => a[TOK + i] > 0);

function renderHours(rows) {

const byModel = rows => sumBy(rows, r => DATA.models[r[3]].replace("claude-", ""));
